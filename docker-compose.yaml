x-kafka-env: &kafka-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092

services:
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - "9094:9094"   # EXTERNAL listener, for tools on the host (eval, kcat)
    environment:
      # Single-node KRaft: this one process is both the broker and the
      # (sole) controller quorum voter — no Zookeeper anywhere.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by topic-setup; see create_topics.sh.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  topic-setup:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      <<: *kafka-env
      STREAM_PARTITIONS: "3"
    volumes:
      - ./scripts/create_topics.sh:/create_topics.sh:ro
    entrypoint: ["bash", "/create_topics.sh"]

  producer:
    build: ./producer
    depends_on:
      topic-setup:
        condition: service_completed_successfully
    environment:
      <<: *kafka-env
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    build: ./gateway
    # Replays once and exits; started on demand so the stack can come up and
    # be inspected first:  docker compose --profile replay up gateway
    profiles: ["replay"]
    depends_on:
      producer:
        condition: service_healthy
    environment:
      PRODUCER_URL: http://producer:5000/send
      REPLAY_CSV: /data/${REPLAY_FILE:-replay.csv}
      RATE_PER_SEC: "${RATE_PER_SEC:-20}"
      MAX_MESSAGES: "${MAX_MESSAGES:-0}"
      # Tag stamped on every message as `source`; eval can filter by it to
      # score one run when several share the same sink.
      DATASET_SOURCE: "${RUN_TAG:-astd}"
    volumes:
      - ./data:/data:ro

  consumer_prediction:
    build: ./consumer_prediction
    depends_on:
      topic-setup:
        condition: service_completed_successfully
    environment:
      <<: *kafka-env
      MODEL_PATH: /model
      BATCH_SIZE: "16"
      TORCH_THREADS: "4"
      RELOAD_CHECK_SECONDS: "5"
      RELOAD_SETTLE_SECONDS: "2"
    volumes:
      # Weights aren't committed (see .gitignore) — train or download them
      # into ./models/arabert_sentiment first; see README "Model weights".
      # Read-only: this service only ever watches the directory for changes.
      - ./models/arabert_sentiment:/model:ro
    restart: unless-stopped
  
  consumer_join:
    build: ./consumer_join
    depends_on:
      topic-setup:
        condition: service_completed_successfully
    environment:
      <<: *kafka-env
      JOINED_RESULTS_PATH: /data/joined_results.jsonl
      # Unmatched halves older than this are evicted to reviews.dlq. Must
      # comfortably exceed worst-case prediction lag (backlog / throughput).
      JOIN_TTL_SECONDS: "300"
    volumes:
      # Real sink, visible on the host at ./data (read by eval + dashboard).
      - ./data:/data
    restart: unless-stopped

  alerting:
    build: ./alerting
    depends_on:
      topic-setup:
        condition: service_completed_successfully
    environment:
      <<: *kafka-env
      WINDOW_SECONDS: "${ALERT_WINDOW_SECONDS:-60}"
      NEGATIVE_SHARE_THRESHOLD: "${ALERT_THRESHOLD:-0.4}"
      # Hysteresis: re-arm only once the share falls below this (default
      # 0.8 x threshold), so a share hovering at the threshold alerts once.
      REARM_BELOW: "${ALERT_REARM_BELOW:-}"
      MIN_COUNT: "${ALERT_MIN_COUNT:-20}"
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    depends_on:
      topic-setup:
        condition: service_completed_successfully
    environment:
      <<: *kafka-env
      JOINED_RESULTS_PATH: /data/joined_results.jsonl
    ports:
      - "8501:8501"
    volumes:
      - ./data:/data:ro
